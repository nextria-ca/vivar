[package]
name = "vivar"
version = "0.1.0"
edition = "2021"
description = "Fast, license-safe Python environment manager"

[dependencies]
anyhow = "1"
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
clap_complete = "4"
toml_edit = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
